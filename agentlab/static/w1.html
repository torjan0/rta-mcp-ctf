// The F1 terminal: which captured screen shows, and what each key does.
// build.py inlines this file into the page after FRAMES and GRAPH. Node's test
// runner loads it as a module, where no page exists.

const REPLY = "This is a practice terminal for the RTA lab. Type /mcp to see the connected servers.";
const MAX_INPUT = 200;

// Only the graph's own keys count, never names every object inherits (constructor, __proto__).
function edgeOf(graph, state, key) {
  const edges = Object.prototype.hasOwnProperty.call(graph.edges, state) ? graph.edges[state] : {};
  return Object.prototype.hasOwnProperty.call(edges, key) ? edges[key] : undefined;
}

function createTerminal(graph) {
  const prompts = new Set([...(graph.prompts || [graph.start]), "reply"]);
  const t = {
    state: graph.start,
    input: "",
    said: "",
    type(ch) {
      if (prompts.has(t.state) && t.input.length < MAX_INPUT) t.input += ch;
    },
    key(name) {
      if (prompts.has(t.state)) {
        if (name === "Backspace") t.input = t.input.slice(0, -1);
        else if (name === "Escape" && t.state === "reply") { t.state = graph.start; t.input = ""; }
        else if (name === "Enter") submit();
        return;
      }
      const next = edgeOf(graph, t.state, name);
      if (next) t.state = next;
    },
  };
  function submit() {
    const cmd = t.input.trim();
    t.input = "";
    if (!cmd) return;
    const next = edgeOf(graph, graph.start, cmd);
    if (next) t.state = next;
    else if (cmd === "/clear") t.state = graph.start;
    else { t.state = "reply"; t.said = cmd; }
  }
  return t;
}

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const textOf = (line) => line.replace(/<[^>]*>/g, "");
const CURSOR = '<span style="background:#d0cfcc;color:#171421"> </span>';

// The prompt line is the one that starts with ❯ at the left edge; list cursors are indented.
function withPrompt(html, input) {
  const lines = html.split("\n");
  const i = lines.findIndex((l) => textOf(l).startsWith("❯"));
  if (i >= 0) lines[i] = "❯ " + esc(input) + CURSOR;
  return lines.join("\n");
}

// The user's line and Claude's reply go into the blank rows under the header,
// which ends at the line naming the project folder.
function withReply(html, said) {
  const lines = html.split("\n");
  const folder = lines.findIndex((l) => textOf(l).includes("invoice-sync"));
  const add = [
    "",
    '<span style="color:#999999">&gt; ' + esc(said.length > 100 ? said.slice(0, 100) + "…" : said) + "</span>",
    "",
    '<span style="color:#ffffff">⏺</span> ' + esc(REPLY),
  ];
  lines.splice(folder >= 0 ? folder + 1 : 3, add.length, ...add);
  return lines.join("\n");
}

// A click that ends a text selection must not take focus, or the selection is lost
// before the player can copy the tool's full name.
function wantsFocus(selectedText) {
  return selectedText === "";
}

if (typeof module !== "undefined") module.exports = { createTerminal, REPLY, withPrompt, withReply, wantsFocus };

if (typeof document !== "undefined") {
  const t = createTerminal(GRAPH);
  const screen = document.getElementById("screen");
  const keys = document.getElementById("keys");
  function render() {
    let html = FRAMES[t.state === "reply" ? GRAPH.start : t.state];
    if (typeof html !== "string") { t.state = GRAPH.start; html = FRAMES[GRAPH.start]; }
    if (t.state === "reply") html = withReply(html, t.said);
    if (t.state === "reply" || (GRAPH.prompts || []).includes(t.state)) html = withPrompt(html, t.input);
    screen.innerHTML = html;
  }

  const NAMES = { ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right",
                  Enter: "Enter", Escape: "Escape", Backspace: "Backspace", Tab: "Tab" };
  // Keys are read on the whole page, so they still work after a click selected text.
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return; // leave copy and paste to the browser
    const name = NAMES[e.key];
    if (name) {
      e.preventDefault();
      t.key(name);
      render();
    } else if (e.key.length === 1 && e.target !== keys) {
      e.preventDefault();
      t.type(e.key);
      render();
      focus();
    }
  });
  // Printable text arrives through the hidden input, which also serves phone keyboards and paste.
  keys.addEventListener("input", () => {
    for (const ch of keys.value) t.type(ch);
    keys.value = "";
    render();
  });
  function focus() { keys.focus({ preventScroll: true }); }
  document.addEventListener("click", () => { if (wantsFocus(String(window.getSelection()))) focus(); });
  window.addEventListener("load", focus);
  focus();
  render();
}
